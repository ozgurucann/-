<html lang="ko"> <head>

    <h1>📚 배운 단어 공유 (Bae-un Dan-eo Gong-yu)</h1> <form id="kelimeFormu">

            <option value="">선택 (Seon-taek)</option> <option value="ingilizce">영어 (Yeong-eo)</option>
            <option value="ispanyolca">스페인어 (Seupein-eo)</option>
            <option value="almanca">독일어 (Dogil-eo)</option>
            <option option="fransizca">프랑스어 (Peurang-seu-eo)</option>
            <option value="diger">기타 (Gita)</option>
        </select>

        <label for="kelime">배운 단어 (한국어/외국어): (Bae-un Dan-eo)</label> <input type="text" id="kelime" required>

        <label for="anlam">터키어 의미: (Teoki-eo Eui-mi)</label> <input type="text" id="anlam" required>

        <button type="submit">추가 (Chu-ga)</button> </form>
