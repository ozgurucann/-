<script>
    document.getElementById('wordForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const word = document.getElementById('kelime').value.toUpperCase();
        const airplane = document.getElementById('airplane');
        const wordDisplay = document.getElementById('wordDisplay');

        // 1. Kelimeyi uçağın üzerine yaz
        wordDisplay.textContent = word;

        // 2. Önce uçuş sınıfını ve animasyonu SIFIRLA (Çok önemli!)
        airplane.classList.remove('flying');
        airplane.style.transition = 'none';
        airplane.style.transform = 'translateX(-100px)'; // Başlangıç konumuna çek

        // 3. Tarayıcıya bu sıfırlamayı işlemesi için bir an ver (requestAnimationFrame)
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                // 4. Şimdi animasyon ayarlarını geri getir ve uçuşu BAŞLAT
                airplane.style.transition = 'transform 8s linear'; // 8 saniye boyunca uç
                airplane.classList.add('flying');
            });
        }); 
    });
</script>
